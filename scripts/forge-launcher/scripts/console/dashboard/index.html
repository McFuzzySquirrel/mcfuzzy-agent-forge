<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="forge-token" content="__FORGE_TOKEN__" />
  <title>Forge Console</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">Forge Console</div>
      <nav id="nav" aria-label="Main"></nav>
    </aside>
    <div id="main">
      <header id="contextbar" aria-label="Project context">
        <div id="contextbar-project"></div>
        <div id="contextbar-actions"></div>
      </header>
      <div id="live-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <main id="view" aria-live="polite"></main>
    </div>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
