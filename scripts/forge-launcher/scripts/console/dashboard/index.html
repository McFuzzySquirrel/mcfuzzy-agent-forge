<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="forge-token" content="__FORGE_TOKEN__" />
  <title>Forge Console</title>
  <script>
    // Run before the stylesheet paints: mirror the cached theme preference onto
    // <html> so a saved Light theme never flashes dark while settings load.
    (() => {
      try {
        const stored = localStorage.getItem("forge-console.theme");
        const preference = stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
        const dark = typeof window.matchMedia === "function"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : true;
        const theme = preference === "auto" ? (dark ? "dark" : "light") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/vendor/xterm.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">Forge Console</div>
      <nav id="nav" aria-label="Main"></nav>
    </header>
    <header id="contextbar" aria-label="Project context">
      <div id="contextbar-project"></div>
      <div id="contextbar-actions"></div>
    </header>
    <div id="live-announcements" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <main id="view" aria-live="polite"></main>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
